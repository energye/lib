<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>
    测试
  </title>
</head>
<script type="text/javascript">
  function msg(msg) {
    document.getElementById("msg").innerText = msg;
  }
  function JSAlert() {
    alert("JS-Alert");
  }
  function JSConfirm() {
    var r = confirm('JS-confirm');
    msg(r);
  }
  function JSPrompt() {
    var r = prompt('JS-prompt', 'default-text');
    msg(r);
  }

  function runScript() {
    //window.external.JSExternal("runScript", "alert('hello!')")
  }

  function scriptMessage() {
    window.webkit.messageHandlers.processMessage.postMessage("testmessage");
  }

</script>

<body>
<a href="https://gitee.com/energye/energy">https://gitee.com/energye/energy</a>
<button onclick="JSAlert();">JSAlert</button><br /><br />
<button onclick="JSConfirm();">JSConfirm</button><br /><br />
<button onclick="runScript();">runScript</button><br /><br />
<button onclick="JSPrompt();">JSPrompt</button><br /><br />
<button onclick="scriptMessage();">scriptMessage</button><br /><br />
<input value="test">
<br>
<div id="msg" style="border: 1px; width: 100%;"></div>
</body>
</html>
