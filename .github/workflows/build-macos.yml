name: Build MacOS(x86_64, M(n))

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  macos-x86_64-arm64:
    runs-on: ${{ matrix.operating-system }}

    strategy:
      matrix:
        operating-system: [ macos-12 ]
        lazarus-versions: [ 3.6 ]

    steps:
      - uses: actions/checkout@v4

      - name: Config Base Environment  # 配置基础环境
        run: |
          git config --global --add safe.directory ./
          git fetch
          sudo chmod +x ./.github/shell/add-package.sh
          mkdir $RUNNER_WORKSPACE/bins

      - name: Install Golang Environment # Install Golang
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'


      - name: Install Lazarus Environment # Install Lazarus
        uses: energye/setup-lazarus@v1.0.0
        with:
          lazarus-version: ${{ matrix.lazarus-versions }}
          with-cache: true

      - name: Lazarus Execution Permissions
        run: |
          sudo chown -R ${USER}:admin /Applications/Lazarus
          ls -la /Applications/Lazarus

      # LCL
      - name: Build Dynamic library LCL(x86_64)
        run: |
          sudo git clean -xdf
          mkdir bin && sudo ./.github/shell/add-package.sh
          sudo lazbuild -B --bm="MacOSx64" --ws=cocoa "liblcl.lpi"
          zip -j $RUNNER_WORKSPACE/bins/lcl_binary_macosx64.zip ./bin/liblcl.dylib

      - name: Build Dynamic library LCL(ARM64)
        run: |
          sudo git clean -xdf
          mkdir bin && sudo ./.github/shell/add-package.sh
          sudo lazbuild -B --bm="MacOSARM64" --ws=cocoa "liblcl.lpi"
          zip -j $RUNNER_WORKSPACE/bins/lcl_binary_macosarm64.zip ./bin/liblcl.dylib

      # LCL + CEF
      - name: Build Dynamic library LCL + CEF(x86_64)
        run: |
          sudo git clean -xdf
          mkdir bin && sudo ./.github/shell/add-package.sh
          sudo lazbuild -B --bm="MacOSx64_CEF" --ws=cocoa "liblcl.lpi"
          zip -j $RUNNER_WORKSPACE/bins/lcl_cef_binary_macosx64.zip ./bin/liblcl.dylib

      - name: Build Dynamic library LCL + CEF(ARM64)
        run: |
          sudo git clean -xdf
          mkdir bin && sudo ./.github/shell/add-package.sh
          sudo lazbuild -B --bm="MacOSARM64_CEF" --ws=cocoa "liblcl.lpi"
          zip -j $RUNNER_WORKSPACE/bins/lcl_cef_binary_macosarm64.zip ./bin/liblcl.dylib

      # LCL + WK2
      - name: Build Dynamic library LCL + WK2(x86_64)
        run: |
          sudo git clean -xdf
          mkdir bin && sudo ./.github/shell/add-package.sh
          sudo lazbuild -B --bm="MacOSx64_WK2" --ws=cocoa "liblcl.lpi"
          zip -j $RUNNER_WORKSPACE/bins/lcl_wk2_binary_macosx64.zip ./bin/liblcl.dylib

      - name: Build Dynamic library LCL + WK2(ARM64)
        run: |
          sudo git clean -xdf
          mkdir bin && sudo ./.github/shell/add-package.sh
          sudo lazbuild -B --bm="MacOSARM64_WK2" --ws=cocoa "liblcl.lpi"
          zip -j $RUNNER_WORKSPACE/bins/lcl_wk2_binary_macosarm64.zip ./bin/liblcl.dylib

      # LCL + CEF_109.1.18
      - name: Build Dynamic library LCL + CEF_109.1.18(x86_64)
        run: |
          git clean -xdf
          git -c credential.helper= -c core.quotepath=false -c log.showSignature=false checkout -B CEF_109.1.18 origin/CEF_109.1.18 --
          mkdir bin && sudo ./.github/shell/add-package.sh
          lazbuild -B --bm="MacOSx64" "liblcl.lpi"
          zip -j $RUNNER_WORKSPACE/bins/lcl_cef_109.1.18_binary_macosx64.zip ./bin/liblcl.dylib

      - name: Build Dynamic library LCL + CEF_109.1.18(ARM64)
        run: |
          git clean -xdf
          mkdir bin && sudo ./.github/shell/add-package.sh
          lazbuild -B --bm="MacOSARM64" "liblcl.lpi"
          zip -j $RUNNER_WORKSPACE/bins/lcl_cef_109.1.18_binary_macosarm64.zip ./bin/liblcl.dylib

      # LCL + CEF_106.1.1
      - name: Build Dynamic library LCL + CEF_106.1.1(x86_64)
        run: |
          git clean -xdf
          git -c credential.helper= -c core.quotepath=false -c log.showSignature=false checkout -B CEF_106.1.1 origin/CEF_106.1.1 --
          mkdir bin && sudo ./.github/shell/add-package.sh
          lazbuild -B --bm="MacOSx64" "liblcl.lpi"
          zip -j $RUNNER_WORKSPACE/bins/lcl_cef_106.1.1_binary_macosx64.zip ./bin/liblcl.dylib

      - name: Build Dynamic library LCL + CEF_106.1.1(ARM64)
        run: |
          git clean -xdf
          mkdir bin && sudo ./.github/shell/add-package.sh
          lazbuild -B --bm="MacOSARM64" "liblcl.lpi"
          zip -j $RUNNER_WORKSPACE/bins/lcl_cef_106.1.1_binary_macosarm64.zip ./bin/liblcl.dylib

      # LCL + CEF_101.0.18
      - name: Build Dynamic library LCL + CEF_101.0.18(x86_64)
        run: |
          git clean -xdf
          git -c credential.helper= -c core.quotepath=false -c log.showSignature=false checkout -B CEF_101.0.18 origin/CEF_101.0.18 --
          mkdir bin && sudo ./.github/shell/add-package.sh
          lazbuild -B --bm="MacOSx64" "liblcl.lpi"
          zip -j $RUNNER_WORKSPACE/bins/lcl_cef_101.0.18_binary_macosx64.zip ./bin/liblcl.dylib

      - name: Build Dynamic library LCL + CEF_101.0.18(ARM64)
        run: |
          git clean -xdf
          git -c credential.helper= -c core.quotepath=false -c log.showSignature=false checkout -B CEF_101.0.18 origin/CEF_101.0.18 --
          mkdir bin && sudo ./.github/shell/add-package.sh
          lazbuild -B --bm="MacOSARM64" "liblcl.lpi"
          zip -j $RUNNER_WORKSPACE/bins/lcl_cef_101.0.18_binary_macosarm64.zip ./bin/liblcl.dylib

      - name: Release Binary ZIP # 将二进制文件上传到发布tags
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ../bins/**