name: Build MacOS(x86_64, M(n))

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  macos-x86_64-arm64:
    runs-on: ${{ matrix.operating-system }}

    strategy:
      matrix:
        operating-system: [ macos-12 ]
        lazarus-versions: [ 3.6 ]

    steps:
      - uses: actions/checkout@v4

      - name: Config Base Environment  # 配置基础环境
        run: |
          git config --global --add safe.directory ./
          git fetch
          mkdir $RUNNER_WORKSPACE/bins
          chmod +x ./.github/shell/add-package.sh

      - name: Install Golang Environment # Install Golang
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'


      - name: Install Lazarus Environment # Install Lazarus
        uses: energye/setup-lazarus@v1.0.0
        with:
          lazarus-version: ${{ matrix.lazarus-versions }}
          with-cache: true

      - name: Lazarus Execution Permissions
        run: |
          sudo chown -R ${USER}:admin /Applications/Lazarus
          ls -la /Applications/Lazarus    
          

      - name: Build Dynamic library LCL CEF (x86_64) # 构建 LCL + CEF
        run: |
          git clean -xdf
          mkdir bin && ./.github/shell/add-package.bat
          sudo lazbuild -B --bm="MacOSx64 CEF" --ws=cocoa "liblcl.lpi"
          zip -j $RUNNER_WORKSPACE/bins/lcl_cef_binary_macosx64.zip ./bin/liblcl.dll

      - name: Build Dynamic library LCL CEF (ARM64) # 构建 LCL + CEF
        run: |
          git clean -xdf
          mkdir bin && ./.github/shell/add-package.bat
          sudo lazbuild -B --bm="MacOSARM64 CEF" --ws=cocoa "liblcl.lpi"
          zip -j $RUNNER_WORKSPACE/bins/lcl_cef_binary_macosarm.zip ./bin/liblcl.dll

      - name: Release Binary ZIP # 将二进制文件上传到发布tags
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ../bins/**