name: debug lazsetup

# 新增的调试 workflow：只做验证，不发布产物。
# 原有 5 个构建 workflow 已用 if: false 停用，待这里验证通过后再改造恢复。
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label'
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-22.04
          - windows-latest
          - macos-latest
          - macos-14
      lazarus:
        description: 'Lazarus version'
        required: true
        default: '4.8'
      target_os:
        description: 'Target OS'
        required: true
        default: linux
        type: choice
        options: [windows, linux, darwin]
      target_arch:
        description: 'Target architecture'
        required: true
        default: amd64
        type: choice
        options: ['386', 'amd64', 'arm', 'arm64']
      mode:
        description: 'Build mode name from liblcl.lpi, e.g. win_amd64 / linux_GTK3 (empty = all matching modes)'
        required: false
        default: ''
      run_setup:
        description: 'Really download + install + compile the toolchain on the runner'
        type: boolean
        default: true
      run_build:
        description: 'Really build libenergy (requires run_setup)'
        type: boolean
        default: true
      verify_downloads:
        description: 'Extra step: download artifacts and check sha/size without installing'
        type: boolean
        default: false
      no_container:
        description: 'Compile on the host instead of docker'
        type: boolean
        default: false

env:
  GOWORK: off

jobs:
  debug:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Build lazsetup binary
        shell: bash
        run: |
          set -e
          BIN=lazsetup
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=lazsetup.exe; fi
          go -C tools/lazsetup build -o "../../$BIN" ./cmd/lazsetup
          echo "LAZSETUP_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Unit tests (offline end-to-end)
        shell: bash
        run: go -C tools/lazsetup test ./...

      - name: Config doctor (offline consistency)
        shell: bash
        run: |
          ./"$LAZSETUP_BIN" doctor --repo "$GITHUB_WORKSPACE"

      - name: Download URL reachability (diagnostic)
        continue-on-error: true
        shell: bash
        run: |
          ./"$LAZSETUP_BIN" doctor --network --repo "$GITHUB_WORKSPACE" --os "${{ inputs.target_os }}" --arch "${{ inputs.target_arch }}"

      - name: Full matrix dry-run (8 targets)
        shell: bash
        run: |
          set -e
          for t in windows/386 windows/amd64 linux/386 linux/amd64 linux/arm linux/arm64 darwin/amd64 darwin/arm64; do
            os=${t%/*}; arch=${t#*/}
            echo "--- $t"
            ./"$LAZSETUP_BIN" setup --os "$os" --arch "$arch" --lazarus "${{ inputs.lazarus }}" --repo "$GITHUB_WORKSPACE" --dry-run > /dev/null
            ./"$LAZSETUP_BIN" build  --os "$os" --arch "$arch" --lazarus "${{ inputs.lazarus }}" --repo "$GITHUB_WORKSPACE" --dry-run > /dev/null
          done
          echo "all 8 targets resolved"

      - name: Resolve config (offline)
        shell: bash
        run: |
          ./"$LAZSETUP_BIN" version
          ./"$LAZSETUP_BIN" list --expand
          ./"$LAZSETUP_BIN" env --lazarus "${{ inputs.lazarus }}" --os "${{ inputs.target_os }}" --arch "${{ inputs.target_arch }}"

      - name: Dry-run plan (no network, no commands)
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ inputs.no_container }}" = "true" ]; then EXTRA="--no-container"; fi
          MODES=""
          if [ -n "${{ inputs.mode }}" ]; then MODES="--mode ${{ inputs.mode }}"; fi
          ./"$LAZSETUP_BIN" setup --lazarus "${{ inputs.lazarus }}" --os "${{ inputs.target_os }}" --arch "${{ inputs.target_arch }}" --repo "$GITHUB_WORKSPACE" --dry-run $EXTRA
          ./"$LAZSETUP_BIN" build --lazarus "${{ inputs.lazarus }}" --os "${{ inputs.target_os }}" --arch "${{ inputs.target_arch }}" --repo "$GITHUB_WORKSPACE" --dry-run $EXTRA $MODES

      - name: Verify downloads (checksum only)
        if: ${{ inputs.verify_downloads }}
        shell: bash
        run: |
          ./"$LAZSETUP_BIN" verify --lazarus "${{ inputs.lazarus }}" --os "${{ inputs.target_os }}" --arch "${{ inputs.target_arch }}" --repo "$GITHUB_WORKSPACE"

      - name: Linux native build dependencies
        if: ${{ inputs.run_setup && inputs.target_os == 'linux' }}
        shell: bash
        run: |
          sudo apt-get update -q -y
          sudo apt-get install -q -y --no-install-recommends \
            make binutils build-essential zip unzip \
            libx11-dev libcairo2-dev libpango1.0-dev libgtk-3-dev
          # GTK2 dev package names differ between Ubuntu releases.
          sudo apt-get install -q -y --no-install-recommends libgtk2.0-dev || true
          sudo apt-get install -q -y --no-install-recommends libgdk-pixbuf-2.0-dev || \
            sudo apt-get install -q -y --no-install-recommends libgdk-pixbuf2.0-dev || true
          dpkg -l | grep -E 'libgtk2.0-dev|libgdk-pixbuf' || true

      - name: Setup toolchain
        if: ${{ inputs.run_setup }}
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ inputs.no_container }}" = "true" ]; then EXTRA="--no-container"; fi
          ./"$LAZSETUP_BIN" setup --lazarus "${{ inputs.lazarus }}" --os "${{ inputs.target_os }}" --arch "${{ inputs.target_arch }}" --repo "$GITHUB_WORKSPACE" --github $EXTRA

      - name: Build lib
        if: ${{ inputs.run_setup && inputs.run_build }}
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ inputs.no_container }}" = "true" ]; then EXTRA="--no-container"; fi
          MODES=""
          if [ -n "${{ inputs.mode }}" ]; then MODES="--mode ${{ inputs.mode }}"; fi
          ./"$LAZSETUP_BIN" build --lazarus "${{ inputs.lazarus }}" --os "${{ inputs.target_os }}" --arch "${{ inputs.target_arch }}" --repo "$GITHUB_WORKSPACE" --out bins $EXTRA $MODES

      - name: Verify built libraries
        if: ${{ inputs.run_setup && inputs.run_build }}
        shell: bash
        run: |
          set -e
          echo "=== bins/ ==="
          ls -lh bins/
          for z in bins/*.zip; do
            [ -f "$z" ] || continue
            echo "--- $z"
            unzip -l "$z"
            echo -n "    first entry magic: "
            entry=$(unzip -Z1 "$z" | head -1)
            unzip -p "$z" "$entry" | od -An -tx1 -N4
          done

      - name: Upload artifacts
        if: ${{ inputs.run_setup && inputs.run_build }}
        uses: actions/upload-artifact@v4
        with:
          name: lazsetup-debug-${{ inputs.target_os }}-${{ inputs.target_arch }}
          path: bins/**
          if-no-files-found: warn
