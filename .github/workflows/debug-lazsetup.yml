name: debug lazsetup

# Combination matrix validation entry point. The 5 production workflows stay
# disabled (job-level if: false) until the owner explicitly asks to restore
# them; this workflow is the only place where real toolchain/lib builds run.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label'
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-22.04
          - windows-latest
          - macos-latest
          - macos-15
          - macos-14
          - macos-15-intel
      lazarus:
        description: 'Lazarus version'
        required: true
        default: '4.8'
      target_os:
        description: 'Target OS'
        required: true
        default: linux
        type: choice
        options: [windows, linux, darwin]
      target_arch:
        description: 'Target architecture'
        required: true
        default: amd64
        type: choice
        options: ['386', 'amd64', 'arm', 'arm64']
      mode:
        description: 'Legacy build mode name from liblcl.lpi (only used when combo_mode is off)'
        required: false
        default: ''
      combo_mode:
        description: 'Build the UI combination matrix instead of legacy build modes'
        type: boolean
        default: true
      combos:
        description: 'Comma separated combinations (empty = all): lcl,webview,cef,cef-webview'
        required: false
        default: ''
      cef_versions:
        description: 'Comma separated CEF versions (empty = all four)'
        required: false
        default: 'CEF109'
      widgetsets:
        description: 'Comma separated Linux widgetsets (empty = gtk2+gtk3)'
        required: false
        default: 'gtk2,gtk3'
      run_setup:
        description: 'Really download + install + compile the toolchain on the runner'
        type: boolean
        default: true
      run_build:
        description: 'Really build libenergy (requires run_setup)'
        type: boolean
        default: true
      verify_downloads:
        description: 'Extra step: download artifacts and check sha/size without installing'
        type: boolean
        default: false
      no_container:
        description: 'Compile on the host instead of docker (diagnostics only)'
        type: boolean
        default: false

env:
  GOWORK: off

jobs:
  debug:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Show dispatch inputs
        shell: bash
        run: |
          mkdir -p "$HOME/.cache/lazsetup"
          echo "runner=${{ inputs.runner }} lazarus=${{ inputs.lazarus }} target=${{ inputs.target_os }}/${{ inputs.target_arch }} mode='${{ inputs.mode }}'"
          echo "combo_mode=${{ inputs.combo_mode }} combos='${{ inputs.combos }}' cef='${{ inputs.cef_versions }}' ws='${{ inputs.widgetsets }}'"
          echo "setup=${{ inputs.run_setup }} build=${{ inputs.run_build }} no_container=${{ inputs.no_container }}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "=== macOS linker (FPC 3.2.x breaks on Xcode 26+ ld) ==="
            sw_vers
            xcodebuild -version 2>&1 | head -3 || true
            ld -v 2>&1 | head -4 || true
          fi

      - name: Restore toolchain download cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/lazsetup
          key: lazsetup-dl-${{ runner.os }}-${{ inputs.lazarus }}-${{ inputs.target_os }}-${{ inputs.target_arch }}-v1
          restore-keys: lazsetup-dl-

      - uses: actions/setup-go@v5
        with:
          # Go 1.21/1.22 link macOS test binaries without LC_UUID; current
          # macOS dyld aborts them. Keep go.mod at 1.21, build with 1.24.
          go-version: '1.24'
          cache: false

      - name: Build lazsetup binary
        shell: bash
        run: |
          set -e
          BIN=lazsetup
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=lazsetup.exe; fi
          go -C tools/lazsetup build -o "../../$BIN" ./cmd/lazsetup
          echo "LAZSETUP_BIN=$BIN" >> "$GITHUB_ENV"

      # tools/lazbuild is a standalone package main with no go.mod. Build it
      # as a single file from inside the lazsetup module, cross-compiled for
      # the target so the Linux docker container can execute it natively.
      - name: Build tools/lazbuild wrapper for the target
        shell: bash
        run: |
          set -e
          OS="${{ inputs.target_os }}"
          ARCH="${{ inputs.target_arch }}"
          SUFFIX=""
          if [ "$OS" = "windows" ]; then SUFFIX=".exe"; fi
          OUT="$GITHUB_WORKSPACE/tools/lazbuild/lazbuild-${OS}-${ARCH}${SUFFIX}"
          GOOS="$OS" GOARCH="$ARCH" go -C tools/lazsetup build -o "$OUT" ../../tools/lazbuild/lazbuild.go
          if [ "$OS" != "windows" ]; then chmod +x "$OUT"; fi
          echo "wrapper: $OUT"
          ls -lh "$OUT"

      - name: Unit tests (offline end-to-end)
        shell: bash
        run: go -C tools/lazsetup test ./...

      - name: Config doctor (offline consistency)
        shell: bash
        run: |
          ./"$LAZSETUP_BIN" doctor --repo "$GITHUB_WORKSPACE"

      - name: Download URL reachability (diagnostic)
        continue-on-error: true
        shell: bash
        run: |
          ./"$LAZSETUP_BIN" doctor --network --repo "$GITHUB_WORKSPACE" --os "${{ inputs.target_os }}" --arch "${{ inputs.target_arch }}"

      - name: Full matrix dry-run (8 targets)
        shell: bash
        run: |
          set -e
          for t in windows/386 windows/amd64 linux/386 linux/amd64 linux/arm linux/arm64 darwin/amd64 darwin/arm64; do
            os=${t%/*}; arch=${t#*/}
            echo "--- $t"
            ./"$LAZSETUP_BIN" setup --os "$os" --arch "$arch" --lazarus "${{ inputs.lazarus }}" --repo "$GITHUB_WORKSPACE" --dry-run > /dev/null
            ./"$LAZSETUP_BIN" build  --os "$os" --arch "$arch" --lazarus "${{ inputs.lazarus }}" --repo "$GITHUB_WORKSPACE" --dry-run > /dev/null
          done
          echo "all 8 targets resolved"

      - name: Resolve combination arguments
        shell: bash
        run: |
          set -e
          ARGS=""
          if [ "${{ inputs.combo_mode }}" = "true" ]; then
            ARGS="--all-combos"
            for v in $(echo "${{ inputs.combos }}" | tr ',' ' '); do
              [ -n "$v" ] && ARGS="$ARGS --combo $v"
            done
            for v in $(echo "${{ inputs.cef_versions }}" | tr ',' ' '); do
              [ -n "$v" ] && ARGS="$ARGS --cef $v"
            done
            for v in $(echo "${{ inputs.widgetsets }}" | tr ',' ' '); do
              [ -n "$v" ] && ARGS="$ARGS --ws $v"
            done
          fi
          echo "COMBO_ARGS=$ARGS" >> "$GITHUB_ENV"
          echo "combo args: $ARGS"

      - name: Show combination plan
        if: ${{ inputs.combo_mode }}
        shell: bash
        run: |
          ./"$LAZSETUP_BIN" combos --lazarus "${{ inputs.lazarus }}" --os "${{ inputs.target_os }}" --arch "${{ inputs.target_arch }}" --repo "$GITHUB_WORKSPACE" $COMBO_ARGS

      - name: Dry-run plan (no network, no commands)
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ inputs.no_container }}" = "true" ]; then EXTRA="--no-container"; fi
          MODES=""
          if [ -n "${{ inputs.mode }}" ] && [ "${{ inputs.combo_mode }}" != "true" ]; then MODES="--mode ${{ inputs.mode }}"; fi
          ./"$LAZSETUP_BIN" setup --lazarus "${{ inputs.lazarus }}" --os "${{ inputs.target_os }}" --arch "${{ inputs.target_arch }}" --repo "$GITHUB_WORKSPACE" --dry-run $EXTRA
          ./"$LAZSETUP_BIN" build --lazarus "${{ inputs.lazarus }}" --os "${{ inputs.target_os }}" --arch "${{ inputs.target_arch }}" --repo "$GITHUB_WORKSPACE" --dry-run $EXTRA $MODES $COMBO_ARGS

      - name: Verify downloads (checksum only)
        if: ${{ inputs.verify_downloads }}
        shell: bash
        run: |
          ./"$LAZSETUP_BIN" verify --lazarus "${{ inputs.lazarus }}" --os "${{ inputs.target_os }}" --arch "${{ inputs.target_arch }}" --repo "$GITHUB_WORKSPACE"

      - name: Enable cross-architecture containers
        if: ${{ inputs.run_setup && inputs.target_os == 'linux' && inputs.target_arch != 'amd64' }}
        shell: bash
        run: docker run --rm --privileged tonistiigi/binfmt --install all

      # FPC 3.2.4rc1a emits Objective-C method lists that Apple ld rejects on
      # aarch64-darwin (Xcode 15+). The darwin_arm64 build mode points FPC at
      # this shim via --opt=-FD, which links through LLVM's ld64.lld.
      - name: Provide ld64.lld for macOS arm64
        if: ${{ runner.os == 'macOS' && inputs.run_setup && inputs.run_build && inputs.target_os == 'darwin' && inputs.target_arch == 'arm64' }}
        shell: bash
        run: |
          set -e
          if ! command -v ld64.lld >/dev/null 2>&1; then brew install lld; fi
          chmod +x "$GITHUB_WORKSPACE/tools/lazsetup/scripts/darwin-lld/ld"
          command -v ld64.lld
          ld64.lld --version | head -2

      - name: Setup toolchain
        if: ${{ inputs.run_setup }}
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ inputs.no_container }}" = "true" ]; then EXTRA="--no-container"; fi
          ./"$LAZSETUP_BIN" setup --lazarus "${{ inputs.lazarus }}" --os "${{ inputs.target_os }}" --arch "${{ inputs.target_arch }}" --repo "$GITHUB_WORKSPACE" --github $EXTRA

      - name: Build lib
        if: ${{ inputs.run_setup && inputs.run_build }}
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ inputs.no_container }}" = "true" ]; then EXTRA="--no-container"; fi
          MODES=""
          if [ -n "${{ inputs.mode }}" ] && [ "${{ inputs.combo_mode }}" != "true" ]; then MODES="--mode ${{ inputs.mode }}"; fi
          ./"$LAZSETUP_BIN" build --lazarus "${{ inputs.lazarus }}" --os "${{ inputs.target_os }}" --arch "${{ inputs.target_arch }}" --repo "$GITHUB_WORKSPACE" --out bins $EXTRA $MODES $COMBO_ARGS

      - name: Verify built libraries
        if: ${{ inputs.run_setup && inputs.run_build }}
        shell: bash
        run: |
          set -e
          echo "=== bins/ ==="
          ls -lh bins/
          TMP="$RUNNER_TEMP/lazsetup-verify"
          mkdir -p "$TMP"
          for z in bins/*.zip; do
            [ -f "$z" ] || continue
            echo "--- $z"
            unzip -t "$z"
            unzip -Z1 "$z" > "$TMP/entries.txt"
            entry=$(sed -n '1p' "$TMP/entries.txt")
            [ -n "$entry" ] || { echo "empty archive: $z"; exit 1; }
            # Write to a file first: piping unzip into `od -N4` closes the pipe
            # early and fails the step with SIGPIPE (exit 141) under pipefail.
            unzip -p "$z" "$entry" > "$TMP/entry.bin"
            echo "    entry:   $entry"
            echo -n "    magic:   "
            od -An -tx1 -N4 "$TMP/entry.bin"
            echo "    bytes:   $(wc -c < "$TMP/entry.bin")"
            if command -v file >/dev/null 2>&1; then
              echo -n "    format:  "
              file "$TMP/entry.bin"
            fi
          done

      - name: Upload artifacts
        if: ${{ inputs.run_setup && inputs.run_build }}
        uses: actions/upload-artifact@v4
        with:
          name: lazsetup-debug-${{ inputs.target_os }}-${{ inputs.target_arch }}
          path: bins/**
          if-no-files-found: warn

      # Save even when a later step fails or the job is cancelled: macOS pulls
      # ~500 MB per run, so keeping every already-completed component matters.
      - name: Save toolchain download cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/lazsetup
          key: lazsetup-dl-${{ runner.os }}-${{ inputs.lazarus }}-${{ inputs.target_os }}-${{ inputs.target_arch }}-v1
