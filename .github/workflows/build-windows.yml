          mkdir bin && ./.github/shell/add-package.bat
          lazbuild -B --bm="Win32" "liblcl.lpi"
          7z a D:/bins/lcl_cef_109.1.18_binary_windows32.zip ./bin/liblcl.dll
        shell: bash

      - name: Build Dynamic library LCL + CEF_106.1.1
        run: |
          git clean -xdf
          git -c credential.helper= -c core.quotepath=false -c log.showSignature=false checkout -B CEF_106.1.1 origin/CEF_106.1.1 --
          mkdir bin && ./.github/shell/add-package.bat
          lazbuild -B --bm="Win32" "liblcl.lpi"
          7z a D:/bins/lcl_cef_106.1.1_binary_windows32.zip ./bin/liblcl.dll
        shell: bash

      - name: Build Dynamic library LCL + CEF_101.0.18
        run: |
