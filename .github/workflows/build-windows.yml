name: Build Windows(i386, x86_64)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  windows-64:
    runs-on: ${{ matrix.operating-system }}

    strategy:
      matrix:
        operating-system: [ windows-2019 ]
        lazarus-versions: [ 3.6 ]

    steps:
      - uses: actions/checkout@v4

      - name: Config Base Environment  # 配置基础环境
        run: |
          git config --global --add safe.directory ./
          git fetch
          mkdir D:/bins
        shell: bash # git bash

      - name: Install Golang Environment # Install Golang
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'


      - name: Install Lazarus Environment # Install Lazarus
        uses: energye/setup-lazarus@v1.0.0
        with:
          lazarus-version: ${{ matrix.lazarus-versions }}
          with-cache: true

      - name: Build Dynamic library LCL CEF # 构建 LCL + CEF
        run: |
          git clean -xdf
          mkdir bin && ./.github/shell/add-package.bat
          lazbuild -B --bm="Win64 CEF" "liblcl.lpi"
          7z a D:/bins/lcl_cef_binary_windows64.zip ./bin/liblcl.dll
        shell: bash

      - name: Build Dynamic library LCL WV2 # 构建 LCL + Webview2
        run: |
          git clean -xdf
          mkdir bin && ./.github/shell/add-package.bat
          lazbuild -B --bm="Win64 WV2" "liblcl.lpi"
          7z a D:/bins/lcl_wv2_binary_windows64.zip ./bin/liblcl.dll
        shell: bash

      - name: Release Binary ZIP # 将二进制文件上传到发布tags
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: D:/bins/**

  windows-32:
    runs-on: ${{ matrix.operating-system }}

    strategy:
      matrix:
        operating-system: [ windows-2019 ]
        lazarus-versions: [ 3.6 ]

    steps:
      - uses: actions/checkout@v4

      - name: Config Base Environment # 配置基础环境
        run: |
          git config --global --add safe.directory ./
          git fetch
          mkdir D:/bins
        shell: bash # git bash

      - name: Install Golang Environment # Install Golang
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Install Lazarus Environment # Install Lazarus
        uses: energye/setup-lazarus@v1.0.0
        with:
          lazarus-version: ${{ matrix.lazarus-versions }}
          with-cache: true
          os-arch: i386

      - name: Build Dynamic library LCL CEF # 构建 LCL + CEF
        run: |
          git clean -xdf
          mkdir bin && ./.github/shell/add-package.bat
          lazbuild -B --bm="Win32 CEF" "liblcl.lpi"
          7z a D:/bins/lcl_cef_binary_windows32.zip ./bin/liblcl.dll
        shell: bash

      - name: Build Dynamic library LCL WV2 # 构建 LCL + Webview2
        run: |
          git clean -xdf
          mkdir bin && ./.github/shell/add-package.bat
          lazbuild -B --bm="Win32 WV2" "liblcl.lpi"
          7z a D:/bins/lcl_wv2_binary_windows32.zip ./bin/liblcl.dll
        shell: bash

      - name: Release Binary ZIP # 将二进制文件上传到发布tags
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: D:/bins/**