name: probe download mirrors

# Temporary diagnostic: find a download source reachable from GitHub runners.
# Delete this file once toolchain.json is pointed at a working mirror.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Enumerate official Lazarus mirror directories
        shell: bash
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          BASE='https://download.lazarus-ide.org'
          for d in \
            "" \
            "Lazarus%20Windows%2064%20bits/" \
            "Lazarus%20Windows%2064%20bits/Lazarus%204.8/" \
            "Lazarus%20Windows%2032%20bits/Lazarus%204.8/" \
            "Lazarus%20macOS%20aarch64/Lazarus%204.8/" \
            "Lazarus%20macOS%20x86-64/Lazarus%204.8/" \
            "Lazarus%20Zip%20_%20GZip/Lazarus%204.8/" ; do
            echo "=== DIR: /$d"
            curl -sSL --max-time 25 -A "$UA" "$BASE/$d" 2>/dev/null \
              | grep -oE 'href="[^"?][^"]*"' | sed 's/^/    /' | head -30
          done

      - name: Probe exact artifact URLs (Range GET)
        shell: bash
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          L='https://download.lazarus-ide.org'
          F='https://downloads.freepascal.org/fpc/dist/3.2.2'
          URLS=(
            "$L/Lazarus%20Zip%20_%20GZip/Lazarus%204.8/lazarus-4.8-0.tar.gz"
            "$L/Lazarus%20Windows%2064%20bits/Lazarus%204.8/lazarus-4.8-fpc-3.2.2-win64.exe"
            "$L/Lazarus%20Windows%2032%20bits/Lazarus%204.8/lazarus-4.8-fpc-3.2.2-win32.exe"
            "$L/Lazarus%20macOS%20aarch64/Lazarus%204.8/lazarus-darwin-aarch64-4.8.zip"
            "$L/Lazarus%20macOS%20aarch64/Lazarus%204.8/fpc-3.2.4rc1a.intelarm64-macosx.dmg"
            "$L/Lazarus%20macOS%20x86-64/Lazarus%204.8/lazarus-darwin-x86_64-4.8.zip"
            "$F/x86_64-linux/fpc-3.2.2.x86_64-linux.tar"
            "$F/i386-linux/fpc-3.2.2.i386-linux.tar"
            "$F/arm-linux/fpc-3.2.2.arm-linux.tar"
            "$F/aarch64-linux/fpc-3.2.2.aarch64-linux.tar"
            "$F/source/fpc-3.2.2.source.tar.gz"
          )
          for u in "${URLS[@]}"; do
            meta=$(curl -sSL --max-time 30 -A "$UA" -r 0-1023 -o probe.bin \
              -w '%{http_code}|%{content_type}|%{size_download}' "$u" 2>/dev/null || echo 'ERR||0')
            magic=$(head -c 8 probe.bin 2>/dev/null | od -An -tx1 | tr -d ' \n')
            echo "[$meta] magic=$magic  $u"
          done
