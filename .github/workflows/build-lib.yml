name: Build dynamic library

on:
  workflow_dispatch:
#  push:
#    branches: [ "notpresent" ]
#    tags:
#      - 'v*.*.*'

jobs:
  # windows 64
  windows-64:
    runs-on: ${{ matrix.operating-system }}

    strategy:
      matrix:
        operating-system: [ windows-2019 ]
        lazarus-versions: [ 3.6 ]

    steps:
      - uses: actions/checkout@v4

      - name: Build Dynamic library
        run: |
          git config --global --add safe.directory ./
          git fetch
          ls
        shell: bash

      # Golang Install
      - name: Install Golang Environment
        uses: actions/setup-go@v3
        with:
          go-version: '1.20'

      # Lazarus Install
      - name: Install Lazarus Environment
        uses: energye/setup-lazarus@v1.0.4
        with:
          lazarus-version: ${{ matrix.lazarus-versions }}
          with-cache: true

      # Add Package
      - name: Add Lazarus Package
        run: |
          lazbuild --add-package-link ./3rd-party/richmemo/richmemopackage.lpk
          lazbuild ./3rd-party/richmemo/richmemopackage.lpk
          lazbuild --add-package ./3rd-party/richmemo/ide/richmemo_design.lpk
          lazbuild ./3rd-party/richmemo/ide/richmemo_design.lpk
        shell: bash