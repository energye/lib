name: Build dynamic library

on:
#  workflow_dispatch:
  push:
    branches: [ "notpresent" ]
    tags:
      - 'v*.*.*'

jobs:
  # ============== windows 64 ==============
  windows-64:
    runs-on: ${{ matrix.operating-system }}

    strategy:
      matrix:
        operating-system: [ windows-2019 ]
        lazarus-versions: [ 3.6 ]

    steps:
      - uses: actions/checkout@v4

      # 配置基础环境
      - name: Config Base Environment
        run: |
          git config --global --add safe.directory ./
          git fetch
          mkdir D:/bins
        shell: bash # git bash

      # Install Golang
      - name: Install Golang Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      # Install Lazarus
      - name: Install Lazarus Environment
        uses: energye/setup-lazarus@v1.0.4
        with:
          lazarus-version: ${{ matrix.lazarus-versions }}
          with-cache: true

      # 构建 LCL + CEF
      - name: Build Dynamic library LCL CEF
        run: |
          git clean -xdf
          mkdir bin && ./.github/shell/add-package.bat
          lazbuild -B --bm="Win64 CEF" "liblcl.lpi"
          7z a D:/bins/lcl_cef_binary_windows64.zip ./bin/liblcl.dll
        shell: bash

      # 将二进制文件上传到发布tags
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: D:/bins/**

  # ============== windows 32 ==============
  windows-32:
    runs-on: ${{ matrix.operating-system }}

    strategy:
      matrix:
        operating-system: [ windows-2019 ]
        lazarus-versions: [ 3.6 ]

    steps:
      - uses: actions/checkout@v4

      # 配置基础环境
      - name: Config Base Environment
        run: |
          git config --global --add safe.directory ./
          git fetch
          mkdir D:/bins
        shell: bash # git bash

      # Install Golang
      - name: Install Golang Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      # Install Lazarus
      - name: Install Lazarus Environment
        uses: energye/setup-lazarus@v1.0.4
        with:
          lazarus-version: ${{ matrix.lazarus-versions }}
          with-cache: true
          os-arch: i386

      # 构建 LCL + CEF
      - name: Build Dynamic library LCL CEF
        run: |
          git clean -xdf
          mkdir bin && ./.github/shell/add-package.bat
          lazbuild -B --bm="Win32 CEF" "liblcl.lpi"
          7z a D:/bins/lcl_cef_binary_windows32.zip ./bin/liblcl.dll
        shell: bash

      # 将二进制文件上传到发布tags
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: D:/bins/**

  # ============== windows 32 ==============
  linux-amd64:
    runs-on: ${{ matrix.operating-system }}

    strategy:
      matrix:
        operating-system: [ ubuntu-20.04 ]
        lazarus-versions: [ 3.6 ]

    steps:
      - uses: actions/checkout@v4

      # 配置基础环境
      - name: Config Base Environment
        run: |
          git config --global --add safe.directory ./
          git fetch
          mkdir $RUNNER_WORKSPACE/bins && chmod +x ./.github/shell/add-package.sh
          sudo apt-get install libgtk-3-dev

      # Install Golang
      - name: Install Golang Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      # Install Lazarus
      - name: Install Lazarus Environment
        uses: energye/setup-lazarus@v1.0.4
        with:
          lazarus-version: ${{ matrix.lazarus-versions }}
          with-cache: true

      # 构建 LCL + CEF
      - name: Build Dynamic library LCL CEF
        run: |
          git clean -xdf
          mkdir bin && ./.github/shell/add-package.sh
          lazbuild -B --bm="Linux64 CEF" --ws=gtk3 "liblcl.lpi"
          zip -j $RUNNER_WORKSPACE/bins/lcl_cef_binary_linux64.zip ./bin/liblcl.so
        shell: bash

      - name: Release # 将二进制文件上传到发布tags
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ../bins/**