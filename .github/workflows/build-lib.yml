name: Build dynamic library

on:
#  workflow_dispatch:
  push:
    branches: [ "notpresent" ]
    tags:
      - 'v*.*.*'

jobs:
  # ============== Windows 64 ==============
  windows-64:
    runs-on: ${{ matrix.operating-system }}

    strategy:
      matrix:
        operating-system: [ windows-2019 ]
        lazarus-versions: [ 3.6 ]

    steps:
      - uses: actions/checkout@v4

      - name: Config Base Environment  # 配置基础环境
        run: |
          git config --global --add safe.directory ./
          git fetch
          mkdir D:/bins
        shell: bash # git bash

      - name: Install Golang Environment # Install Golang
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'


      - name: Install Lazarus Environment # Install Lazarus
        uses: energye/setup-lazarus@v1.0.0
        with:
          lazarus-version: ${{ matrix.lazarus-versions }}
          with-cache: true


      - name: Build Dynamic library LCL CEF # 构建 LCL + CEF
        run: |
          git clean -xdf
          mkdir bin && ./.github/shell/add-package.bat
          lazbuild -B --bm="Win64 CEF" "liblcl.lpi"
          7z a D:/bins/lcl_cef_binary_windows64.zip ./bin/liblcl.dll
        shell: bash

      - name: Release Binary ZIP # 将二进制文件上传到发布tags
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: D:/bins/**

  # ============== Windows 32 ==============
  windows-32:
    runs-on: ${{ matrix.operating-system }}

    strategy:
      matrix:
        operating-system: [ windows-2019 ]
        lazarus-versions: [ 3.6 ]

    steps:
      - uses: actions/checkout@v4

      - name: Config Base Environment # 配置基础环境
        run: |
          git config --global --add safe.directory ./
          git fetch
          mkdir D:/bins
        shell: bash # git bash

      - name: Install Golang Environment # Install Golang
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Install Lazarus Environment # Install Lazarus
        uses: energye/setup-lazarus@v1.0.0
        with:
          lazarus-version: ${{ matrix.lazarus-versions }}
          with-cache: true
          os-arch: i386

      - name: Build Dynamic library LCL CEF # 构建 LCL + CEF
        run: |
          git clean -xdf
          mkdir bin && ./.github/shell/add-package.bat
          lazbuild -B --bm="Win32 CEF" "liblcl.lpi"
          7z a D:/bins/lcl_cef_binary_windows32.zip ./bin/liblcl.dll
        shell: bash

      - name: Release Binary ZIP # 将二进制文件上传到发布tags
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: D:/bins/**

  # ============== Linux amd64 ==============
  linux-amd64:
    runs-on: ${{ matrix.operating-system }}

    strategy:
      matrix:
        operating-system: [ ubuntu-20.04 ]
        lazarus-versions: [ 3.6 ]

    steps:
      - uses: actions/checkout@v4

      - name: Config Base Environment # 配置基础环境
        run: |
          git config --global --add safe.directory ./
          git fetch
          mkdir $RUNNER_WORKSPACE/bins && chmod +x ./.github/shell/add-package.sh
          sudo apt-get install libgtk-3-dev

      - name: Install Golang Environment  # Install Golang
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Install Lazarus Environment Source # Install Lazarus
        uses: energye/setup-lazarus@v1.0.0
        with:
          lazarus-version: ${{ matrix.lazarus-versions }}
          source-install: true

      - name: Install Lazarus Environment
        run: |
          pwd
          cd $RUNNER_WORKSPACE/lazarus/fpc-3.2.2.x86_64-linux
          sudo echo y | ./install.sh
          pwd
          cd ../
          sudo make clean all
          ls $RUNNER_WORKSPACE/lazarus

      - name: Build Dynamic library LCL CEF # 构建 LCL + CEF
        run: |
          pwd
          git clean -xdf
          mkdir bin
          $RUNNER_WORKSPACE/lazarus/lazbuild --add-package-link ./3rd-party/richmemo/richmemopackage.lpk
          $RUNNER_WORKSPACE/lazarus/lazbuild ./3rd-party/richmemo/richmemopackage.lpk
          $RUNNER_WORKSPACE/lazarus/lazbuild --add-package ./3rd-party/richmemo/ide/richmemo_design.lpk
          $RUNNER_WORKSPACE/lazarus/lazbuild ./3rd-party/richmemo/ide/richmemo_design.lpk
          
          $RUNNER_WORKSPACE/lazarus/lazbuild -B --bm="Linux64 CEF" --ws=gtk3 "liblcl.lpi"
          zip -j $RUNNER_WORKSPACE/bins/lcl_cef_binary_linux64.zip ./bin/liblcl.so

