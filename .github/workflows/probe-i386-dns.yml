name: probe i386 dns

# Temporary diagnostic: i386/debian:11 cannot resolve archive.debian.org
# inside the GitHub runner's default docker bridge network, while
# amd64/debian:11 with the same apt-eol.sh works. Removed after diagnosis.
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Host DNS
        run: |
          cat /etc/resolv.conf
          getent hosts archive.debian.org || true

      - name: Probe i386 container networking
        shell: bash
        run: |
          for MODE in default host publicdns seccomp privileged amd64; do
            echo "==================== MODE=$MODE ===================="
            IMAGE=i386/debian:11
            PLATFORM=linux/386
            case "$MODE" in
              default)    OPTS="";;
              host)       OPTS="--network=host";;
              publicdns)  OPTS="--dns 8.8.8.8 --dns 1.1.1.1";;
              seccomp)    OPTS="--security-opt seccomp=unconfined";;
              privileged) OPTS="--privileged";;
              amd64)      OPTS=""; IMAGE=amd64/debian:11; PLATFORM=linux/amd64;;
            esac
            docker run --rm --platform "$PLATFORM" $OPTS "$IMAGE" sh -c '
              echo "--- getent archive.debian.org ---"; getent hosts archive.debian.org || echo GETENT-FAIL
              echo "--- getent deb.debian.org ---"; getent hosts deb.debian.org || echo GETENT-FAIL
              echo "--- getent ahostsv4 ---"; getent ahostsv4 archive.debian.org || echo AHOSTSV4-FAIL
              echo "--- apt update (archive.debian.org) ---"
              printf "deb http://archive.debian.org/debian bullseye main\n" > /etc/apt/sources.list
              printf "Acquire::Check-Valid-Until \"false\";\n" > /etc/apt/apt.conf.d/99no-valid-until
              apt-get update -o Acquire::Retries=0 -q 2>&1 | tail -6
            ' || echo "MODE=$MODE container failed"
          done
